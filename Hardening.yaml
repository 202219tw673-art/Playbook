---
# ===================================================================
# OS Hardening Baseline — RHEL 8/9
# Mirrors internal baseline checklist (CIS-derived). Each task is
# labeled with the corresponding control reference for traceability.
# ===================================================================
- name: OS Hardening Baseline
  hosts: all
  become: true
  gather_facts: true

  vars:
    hardening_pass_max_days: 90
    hardening_pass_min_days: 7
    hardening_pass_warn_age: 7
    hardening_inactive_days: 30
    hardening_chage_exclude_users: []

    hardening_ssh_config_path: /etc/ssh/sshd_config
    hardening_ssh_x11_forwarding: "no"
    hardening_ssh_allow_tcp_forwarding: "no"
    hardening_ssh_client_alive_interval: 300
    hardening_ssh_client_alive_count_max: 0
    hardening_ssh_permit_root_login: "no"
    hardening_set_ssh_protocol_directive: false
    hardening_ssh_protocol: 2

    hardening_enforce_gpgcheck: true

    hardening_tmp_mount_opts: "nodev,nosuid,noexec"
    hardening_vartmp_mount_opts: "nodev,nosuid,noexec"
    hardening_home_mount_opts: "nodev,nosuid"

    hardening_gdm_banner_enable: false

  
    hardening_disable_wireless: false

    hardening_aide_enabled: true
    hardening_aide_cron_schedule: "0 5"

    hardening_crypto_policy: "DEFAULT"

    hardening_remove_packages:
      - xorg-x11-server-Xorg
      - telnet

    hardening_disable_services:
      - avahi-daemon
      - rpcbind

    hardening_audit_admin_space_left_action: "SUSPEND"
    hardening_audit_privileged_commands: []

    hardening_pwquality_minlen: 14
    hardening_pwquality_dcredit: -1
    hardening_pwquality_ucredit: -1
    hardening_pwquality_lcredit: -1
    hardening_pwquality_ocredit: -1

    hardening_password_remember: 5

  tasks:
    # -----------------------------------------------------------------
    # 189/190/191/192 — Password aging (PASS_MAX_DAYS/MIN_DAYS/WARN_AGE/INACTIVE)
    # -----------------------------------------------------------------
    - name: "189.2 | Set PASS_MAX_DAYS in login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MAX_DAYS'
        line: "PASS_MAX_DAYS   {{ hardening_pass_max_days }}"

    - name: "190.2 | Set PASS_MIN_DAYS in login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_MIN_DAYS'
        line: "PASS_MIN_DAYS   {{ hardening_pass_min_days }}"

    - name: "191 | Set PASS_WARN_AGE in login.defs"
      ansible.builtin.lineinfile:
        path: /etc/login.defs
        regexp: '^PASS_WARN_AGE'
        line: "PASS_WARN_AGE   {{ hardening_pass_warn_age }}"

    - name: "Discover non-system, non-locked accounts (uid>=1000, has password set)"
      ansible.builtin.shell: |
        set -o pipefail
        grep -E '^[^:]+:[^!*]' /etc/shadow | cut -d: -f1
      args:
        executable: /bin/bash
      register: hardening_shadow_users
      changed_when: false

    - name: "Apply chage aging settings to all discovered non-system accounts"
      ansible.builtin.command: >
        chage
        --maxdays {{ hardening_pass_max_days }}
        --mindays {{ hardening_pass_min_days }}
        --warndays {{ hardening_pass_warn_age }}
        --inactive {{ hardening_inactive_days }}
        {{ item }}
      loop: "{{ hardening_shadow_users.stdout_lines }}"
      when: item not in hardening_chage_exclude_users
      changed_when: true

    
    # -----------------------------------------------------------------
    # 205 — Permissions on /etc/passwd-
    # -----------------------------------------------------------------
    - name: "205 | Set permissions on /etc/passwd-"
      ansible.builtin.file:
        path: /etc/passwd-
        owner: root
        group: root
        mode: "0600"
      ignore_errors: true   # file may not exist on every host

    # -----------------------------------------------------------------
    # 209 — No world-writable files (AUDIT ONLY)
    # -----------------------------------------------------------------
    - name: "209 | Scan local filesystems for world-writable files"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev -type f -perm -0002
      args:
        executable: /bin/bash
      register: hardening_world_writable
      changed_when: false

    - name: "209 | Report world-writable files found (manual remediation required)"
      ansible.builtin.debug:
        msg: >
          World-writable files detected — review and remediate manually
          (chmod og-w or 755 as appropriate, app-owned files may need vendor sign-off):
          {{ hardening_world_writable.stdout_lines }}
      when: hardening_world_writable.stdout_lines | length > 0

    # -----------------------------------------------------------------
    # 210 — No unowned files/directories (AUDIT ONLY)
    # -----------------------------------------------------------------
    - name: "210 | Scan for files/dirs with no owning user or group"
      ansible.builtin.shell: |
        set -o pipefail
        df --local -P | awk '{if (NR!=1) print $6}' | xargs -I '{}' find '{}' -xdev \( -nouser -o -nogroup \)
      args:
        executable: /bin/bash
      register: hardening_unowned_files
      changed_when: false

    - name: "210 | Report unowned files/dirs found (manual remediation required)"
      ansible.builtin.debug:
        msg: "Unowned files/dirs detected — assign correct owner/group manually: {{ hardening_unowned_files.stdout_lines }}"
      when: hardening_unowned_files.stdout_lines | length > 0

    # -----------------------------------------------------------------
    # 155-159, 162 — Permissions on crontab/cron.*/sshd_config
    # -----------------------------------------------------------------
    - name: "155-159,162 | Set permissions on cron and sshd_config paths"
      ansible.builtin.file:
        path: "{{ item }}"
        mode: "og-rwx"
      loop:
        - /etc/crontab
        - /etc/cron.hourly
        - /etc/cron.daily
        - /etc/cron.weekly
        - /etc/cron.monthly
        - /etc/cron.d
      ignore_errors: true

    - name: "162 | Set permissions on /etc/ssh/sshd_config"
      ansible.builtin.file:
        path: /etc/ssh/sshd_config
        owner: root
        group: root
        mode: "0600"

    
  

   
    # -----------------------------------------------------------------
    # 193 — All users' last password change date must be in the past (AUDIT)
    # -----------------------------------------------------------------
    - name: "193 | Check for accounts with a future last-password-change date"
      ansible.builtin.shell: |
        set -o pipefail
        awk -F: '/^[^:]+:[^!*]/{print $1}' /etc/shadow | while read -r usr; do
          change=$(date -d "$(chage --list "$usr" | grep '^Last password change' | cut -d: -f2 | grep -v 'never$')" +%s 2>/dev/null)
          if [ -n "$change" ] && [ "$change" -gt "$(date +%s)" ]; then
            echo "$usr"
          fi
        done
      args:
        executable: /bin/bash
      register: hardening_future_pwchange
      changed_when: false

    - name: "193 | Report accounts with future password-change dates"
      ansible.builtin.debug:
        msg: "Accounts with a last-password-change date in the future (fix manually with chage): {{ hardening_future_pwchange.stdout_lines }}"
      when: hardening_future_pwchange.stdout_lines | length > 0
