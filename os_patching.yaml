---
# ---------------------------------------------------------------------------
# Playbook : patching.yml
# Purpose  : Automate secure OS patch installation on RHEL-based servers
#            using yum. Idempotent and safe to re-run; retains execution
#            logs for audit purposes; optional controlled reboot.
# ---------------------------------------------------------------------------
 
        
        ---
- name: Linux OS Patching
  hosts: all
  become: yes

  tasks:

    - name: Refresh package metadata
      command: dnf makecache
      register: cache_result

    - name: Install all updates
      dnf:
        name: "*"
        state: latest
        update_cache: yes
      register: patch_result

    - name: Check if reboot required
      shell: |
        if [ -f /run/reboot-required ]; then
          echo "reboot"
        else
          echo "no reboot"
        fi
      register: reboot_check
      changed_when: false
      failed_when: false

    - name: Display patching status
      debug:
        msg: |
          ================= PATCH REPORT =================

          Host: {{ inventory_hostname }}

          Packages updated:
          {{ patch_result.changed }}

          Reboot Status:
          {{ reboot_check.stdout }}

          =================================================

