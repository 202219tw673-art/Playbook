---
# ---------------------------------------------------------------------------
# Playbook : patching.yml
# Purpose  : Automate secure OS patch installation on RHEL-based servers
#            using yum. Idempotent and safe to re-run; retains execution
#            logs for audit purposes; optional controlled reboot.
# ---------------------------------------------------------------------------

     ---
- name: OS Patching
  hosts: all
  become: yes

  tasks:
    - name: Update package cache
      yum:
        name: '*'
        state: latest

    - name: Check if reboot is required
      command: needs-restarting -r
      register: reboot_check
      ignore_errors: yes

    - name: Reboot server if required
      reboot:
        reboot_timeout: 1800
      when: reboot_check.rc != 0

    - name: Verify server availability
      ping:
``
